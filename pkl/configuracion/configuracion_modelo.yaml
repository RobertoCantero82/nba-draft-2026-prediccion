# --- Hallazgo principal del proyecto ---
hallazgo_principal: >
  La brecha modelo-scout para Aday Mara (el modelo predice R2 / rango 41-50;
  los scouts lo sitúan en R1 / top-10) no es un error del modelo, sino el
  resultado más interesante: su valor está en variables que las estadísticas
  de temporada no miden (atletismo, verticalidad defensiva, techo de
  desarrollo). Random Forest sin posición (0.602) iguala prácticamente al
  XGBoost con posición (0.61): las estadísticas numéricas solas contienen
  casi toda la información predictiva.