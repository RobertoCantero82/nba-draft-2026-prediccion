document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

3,.7,.2,1) both; animation-delay:var(--d,.2s); }\n    section[data-deck-active] [data-barv]{ animation:growY 1.05s cubic-bezier(.3,.7,.2,1) both; animation-delay:var(--d,.18s); transform-origin:bottom; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<x-import component-from-global-scope=\"deck-stage\" no-rail=\"\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\">\n\n<!-- 1 · PORTADA -->\n<section data-label=\"Portada\" data-speaker-notes=\"DraftRadar: una herramienta de ML que predice el draft de la NBA. Trabajo de Roberto Cantero para The Bridge. Hoy os enseño cómo, con datos universitarios y del Combine, un modelo estima ronda, pick y arquetipo de jugador.\" style=\"background:var(--ink); color:var(--paper); padding:var(--pad-y) var(--pad-x); display:flex; flex-direction:column; justify-content:center; overflow:hidden;\">\n  <div style=\"position:absolute; inset:0; background:repeating-radial-gradient(circle at 84% 50%, transparent 0 116px, rgba(220,90,34,0.13) 116px 119px); pointer-events:none;\" data-fade=\"\"><\u002Fdiv>\n  <div style=\"position:absolute; top:0; bottom:0; left:84%; width:2px; background:rgba(220,90,34,0.35);\"><\u002Fdiv>\n  <div style=\"position:relative; max-width:1240px;\">\n    <div data-anim=\"\" style=\"--d:.1s; font-family:var(--f-cond); font-size:var(--t-kicker); font-weight:600; letter-spacing:.32em; text-transform:uppercase; color:var(--orange); margin-bottom:34px;\">The Bridge · Junio 2026<\u002Fdiv>\n    <h1 data-anim=\"\" style=\"--d:.24s; font-family:var(--f-disp); font-weight:900; font-size:172px; line-height:0.92; letter-spacing:-0.02em; margin:0;\"><span style=\"color:var(--paper);\">Draft<\u002Fspan><span style=\"color:var(--orange);\">Radar<\u002Fspan><\u002Fh1>\n    <div data-anim=\"\" style=\"--d:.4s; width:96px; height:5px; background:var(--orange); margin:40px 0 36px;\"><\u002Fdiv>\n    <p data-anim=\"\" style=\"--d:.5s; font-family:var(--f-serif); font-size:46px; line-height:1.2; font-weight:400; max-width:1000px; margin:0; color:var(--paper);\">La herramienta de predicción para el periodista del siglo XXI<\u002Fp>\n    <div data-anim=\"\" style=\"--d:.64s; margin-top:54px; font-family:var(--f-cond); font-size:25px; letter-spacing:.06em; color:var(--muted-d); text-transform:uppercase;\">Roberto Cantero · Machine Learning aplicado al draft NBA<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 2 · METODOLOGÍA / PIPELINE -->\n<section data-label=\"Metodología\" data-speaker-notes=\"El proyecto sigue cuatro fases secuenciales: adquisición de datos, limpieza y EDA, modelado y predicción final. Integra estadística universitaria, el Combine y el historial de draft en un único modelo.\" style=\"background:var(--paper); color:var(--ink); padding:var(--pad-y) var(--pad-x); display:flex; flex-direction:column; overflow:hidden;\">\n  <div data-anim=\"\" style=\"--d:0s;\">\n    <div style=\"font-family:var(--f-cond); font-size:var(--t-kicker); font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:var(--orange); margin-bottom:18px;\">Metodología<\u002Fdiv>\n    <h2 style=\"font-family:var(--f-disp); font-weight:800; font-size:var(--t-title); line-height:1.02; letter-spacing:-0.015em; margin:0; max-width:1320px;\">Un trabajo de datos en cuatro fases<\u002Fh2>\n  <\u002Fdiv>\n  <p data-anim=\"\" style=\"--d:.12s; font-family:var(--f-serif); font-size:var(--t-body); line-height:1.42; color:var(--muted); max-width:1200px; margin:24px 0 0;\">DraftRadar integra estadísticas universitarias, mediciones del Combine e historial de draft en un único modelo predictivo.<\u002Fp>\n\n  <div style=\"position:relative; margin-top:96px;\">\n    <div style=\"position:absolute; left:12.5%; right:12.5%; top:54px; height:4px; background:var(--line);\"><\u002Fdiv>\n    <div data-bar=\"\" style=\"--d:.25s; position:absolute; left:12.5%; right:12.5%; top:54px; height:4px; background:var(--orange); transform-origin:left;\"><\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:repeat(4,1fr); position:relative;\">\n\n      <div data-anim=\"\" style=\"--d:.2s; display:flex; flex-direction:column; align-items:center; text-align:center; padding:0 22px;\">\n        <div style=\"width:108px; height:108px; border-radius:50%; background:var(--paper); border:4px solid var(--orange); display:flex; align-items:center; justify-content:center; font-family:var(--f-cond); font-weight:700; font-size:46px; color:var(--ink);\">01<\u002Fdiv>\n        <h3 style=\"font-family:var(--f-disp); font-weight:800; font-size:32px; margin:30px 0 12px;\">Datos<\u002Fh3>\n        <p style=\"font-family:var(--f-serif); font-size:24px; line-height:1.36; color:var(--muted); margin:0;\">3 datasets: NCAA, Combine y Draft<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-anim=\"\" style=\"--d:.34s; display:flex; flex-direction:column; align-items:center; text-align:center; padding:0 22px;\">\n        <div style=\"width:108px; height:108px; border-radius:50%; background:var(--paper); border:4px solid var(--orange); display:flex; align-items:center; justify-content:center; font-family:var(--f-cond); font-weight:700; font-size:46px; color:var(--ink);\">02<\u002Fdiv>\n        <h3 style=\"font-family:var(--f-disp); font-weight:800; font-size:32px; margin:30px 0 12px;\">Limpieza &amp; EDA<\u002Fh3>\n        <p style=\"font-family:var(--f-serif); font-size:24px; line-height:1.36; color:var(--muted); margin:0;\">Feature engineering y balanceo de clases<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-anim=\"\" style=\"--d:.48s; display:flex; flex-direction:column; align-items:center; text-align:center; padding:0 22px;\">\n        <div style=\"width:108px; height:108px; border-radius:50%; background:var(--paper); border:4px solid var(--orange); display:flex; align-items:center; justify-content:center; font-family:var(--f-cond); font-weight:700; font-size:46px; color:var(--ink);\">03<\u002Fdiv>\n        <h3 style=\"font-family:var(--f-disp); font-weight:800; font-size:32px; margin:30px 0 12px;\">Modelos<\u002Fh3>\n        <p style=\"font-family:var(--f-serif); font-size:24px; line-height:1.36; color:var(--muted); margin:0;\">4 algoritmos comparados<\u002Fp>\n      <\u002Fdiv>\n\n      <div data-anim=\"\" style=\"--d:.62s; display:flex; flex-direction:column; align-items:center; text-align:center; padding:0 22px;\">\n        <div style=\"width:108px; height:108px; border-radius:50%; background:var(--orange); border:4px solid var(--orange); display:flex; align-items:center; justify-content:center; font-family:var(--f-cond); font-weight:700; font-size:46px; color:var(--paper);\">04<\u002Fdiv>\n        <h3 style=\"font-family:var(--f-disp); font-weight:800; font-size:32px; margin:30px 0 12px;\">Predicciones<\u002Fh3>\n        <p style=\"font-family:var(--f-serif); font-size:24px; line-height:1.36; color:var(--muted); margin:0;\">Ronda, pick y arquetipo de 3 candidatos<\u002Fp>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 3 · EDA DATASETS -->\n<section data-label=\"Datasets\" data-speaker-notes=\"La base son tres fuentes complementarias: estadística universitaria de la NCAA, medidas físicas del Combine e historial de draft de la NBA. El gran reto fue el desbalanceo: de más de 50.000 no drafteados se seleccionaron los 1.500 mejores, y se usaron pesos de clase.\" style=\"background:var(--paper); color:var(--ink); padding:var(--pad-y) var(--pad-x); display:flex; flex-direction:column; overflow:hidden;\">\n  <div data-anim=\"\" style=\"--d:0s;\">\n    <div style=\"font-family:var(--f-cond); font-size:var(--t-kicker); font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:var(--orange); margin-bottom:18px;\">02 · EDA<\u002Fdiv>\n    <h2 style=\"font-family:var(--f-disp); font-weight:800; font-size:var(--t-title); line-height:1.02; letter-spacing:-0.015em; margin:0;\">Tres datasets, una visión completa<\u002Fh2>\n  <\u002Fdiv>\n\n  <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:32px; margin-top:56px;\">\n    <div data-anim=\"\" style=\"--d:.18s; background:var(--paper-2); padding:42px 40px 38px; display:flex; flex-direction:column;\">\n      <div style=\"font-family:var(--f-cond); font-size:21px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--navy);\">NCAA Basketball<\u002Fdiv>\n      <div style=\"font-family:var(--f-cond); font-weight:700; font-size:88px; line-height:1; color:var(--ink); margin:22px 0 6px;\"><span data-count=\"61061\" data-dec=\"0\">61.061<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:var(--f-cond); font-size:24px; letter-spacing:.04em; color:var(--muted); text-transform:uppercase;\">registros × 66 columnas<\u002Fdiv>\n      <div style=\"height:1px; background:var(--line); margin:26px 0 22px;\"><\u002Fdiv>\n      <p style=\"font-family:var(--f-serif); font-size:24px; line-height:1.42; color:var(--muted); margin:0;\">Estadísticas universitarias 2009–2021. Variable <em>target<\u002Fem>: pick de draft.<\u002Fp>\n    <\u002Fdiv>\n\n    <div data-anim=\"\" style=\"--d:.32s; background:var(--paper-2); padding:42px 40px 38px; display:flex; flex-direction:column;\">\n      <div style=\"font-family:var(--f-cond); font-size:21px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--navy);\">NBA Combine<\u002Fdiv>\n      <div style=\"font-family:var(--f-cond); font-weight:700; font-size:88px; line-height:1; color:var(--ink); margin:22px 0 6px;\"><span data-count=\"1873\" data-dec=\"0\">1.873<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:var(--f-cond); font-size:24px; letter-spacing:.04em; color:var(--muted); text-transform:uppercase;\">registros × 18 columnas<\u002Fdiv>\n      <div style=\"height:1px; background:var(--line); margin:26px 0 22px;\"><\u002Fdiv>\n      <p style=\"font-family:var(--f-serif); font-size:24px; line-height:1.42; color:var(--muted); margin:0;\">Medidas físicas y atléticas. Base para el modelo de arquetipos.<\u002Fp>\n    <\u002Fdiv>\n\n    <div data-anim=\"\" style=\"--d size:17px; color:var(--muted-d);\">41–50<\u002Fdiv><div style=\"font-family:var(--f-cond); font-size:22px; color:var(--paper); margin-top:5px;\">102<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1; text-align:center;\"><div style=\"font-family:var(--f-cond); font-size:17px; color:var(--muted-d);\">51–60<\u002Fdiv><div style=\"font-family:var(--f-cond); font-size:22px; color:var(--paper); margin-top:5px;\">93<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:1; text-align:center;\"><div style=\"font-family:var(--f-cond); font-size:17px; color:var(--muted-d);\">ND<\u002Fdiv><div style=\"font-family:var(--f-cond); font-weight:700; font-size:26px; color:var(--orange); margin-top:5px;\"><span data-count=\"1500\" data-dec=\"0\">1500<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 4 · CORRELACIONES -->\n<section data-label=\"Correlaciones\" data-speaker-notes=\"El EDA revela qué variables predicen el pick. Los puntos por partido lideran con 0,21 de correlación, seguidos de los rebotes con 0,19. También detectamos alta colinealidad entre variables ofensivas: puntos y robos correlacionan a 0,73.\" style=\"background:var(--paper); color:var(--ink); padding:var(--pad-y) var(--pad-x); display:flex; flex-direction:column; overflow:hidden;\">\n  <div data-anim=\"\" style=\"--d:0s;\">\n    <div style=\"font-family:var(--f-cond); font-size:var(--t-kicker); font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:var(--orange); margin-bottom:18px;\">02 · EDA<\u002Fdiv>\n    <h2 style=\"font-family:var(--f-disp); font-weight:800; font-size:var(--t-title); line-height:1.02; letter-spacing:-0.015em; margin:0;\">Correlaciones que definen el draft<\u002Fh2>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; gap:64px; margin-top:64px; align-items:stretch;\">\n    <div style=\"flex:1.4; display:flex; flex-direction:column; justify-content:center; gap:54px;\">\n      <div data-anim=\"\" style=\"--d:.2s;\">\n        <div style=\"display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px;\">\n          <span style=\"font-family:var(--f-disp); font-weight:700; font-size:32px;\">Puntos <span style=\"color:var(--muted); font-weight:500;\">(pts)<\u002Fspan><\u002Fspan>\n          <span style=\"font-family:var(--f-cond); font-weight:700; font-size:52px; color:var(--orange);\"><span data-count=\"0.21\" data-dec=\"2\">0,21<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"height:30px; background:var(--paper-2);\">\n          <div data-bar=\"\" style=\"--d:.3s; width:84%; height:100%; background:var(--orange); transform-origin:left;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-family:var(--f-serif); font-size:22px; color:var(--muted); margin:12px 0 0;\">Correlación más alta con el pick de draft<\u002Fp>\n      <\u002Fdiv>\n      <div data-anim=\"\" style=\"--d:.34s;\">\n        <div style=\"display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px;\">\n          <span style=\"font-family:var(--f-disp); font-weight:700; font-size:32px;\">Rebotes <span style=\"color:var(--muted); font-weight:500;\">(treb)<\u002Fspan><\u002Fspan>\n          <span style=\"font-family:var(--f-cond); font-weight:700; font-size:52px; color:var(--navy);\"><span data-count=\"0.19\" data-dec=\"2\">0,19<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"height:30px; background:var(--paper-2);\">\n          <div data-bar=\"\" style=\"--d:.44s; width:76%; height:100%; background:var(--navy); transform-origin:left;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-family:var(--f-serif); font-size:22px; color:var(--muted); margin:12px 0 0;\">Segunda variable más predictiva<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-anim=\"\" style=\"--d:.5s; flex:1; background:var(--ink); color:var(--paper); padding:54px 48px; display:flex; flex-direction:column; justify-content:center;\">\n      <div styl  de temporada no mide: impacto defensivo, tamaño y techo de desarrollo. Por eso el draft no es solo estadística.\" style=\"background:var(--paper); color:var(--ink); padding:var(--pad-y) var(--pad-x); display:flex; flex-direction:column; overflow:hidden;\">\n  <div data-anim=\"\" style=\"--d:0s;\">\n    <div style=\"font-family:var(--f-cond); font-size:var(--t-kicker); font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:var(--orange); margin-bottom:16px;\">Análisis crítico<\u002Fdiv>\n    <h2 style=\"font-family:var(--f-disp); font-weight:800; font-size:58px; line-height:1.02; letter-spacing:-0.015em; margin:0;\">La brecha entre el modelo y los analistas<\u002Fh2>\n  <\u002Fdiv>\n\n  <!-- número de draft -->\n  <div data-anim=\"\" style=\"--d:.16s; margin-top:38px; background:var(--ink); padding:38px 48px 30px; position:relative;\">\n    <div style=\"font-family:var(--f-cond); font-size:19px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted-d); margin-bottom:44px;\">Aday Mara · posición estimada en el draft<\u002Fdiv>\n    <div style=\"position:relative; height:64px;\">\n      <div style=\"position:absolute; left:0; right:0; top:32px; height:3px; background:var(--line-d);\"><\u002Fdiv>\n      <!-- marcador analistas ~pick 7 => 10% -->\n      <div style=\"position:absolute; left:10%; top:0; transform:translateX(-50%); text-align:center;\">\n        <div style=\"font-family:var(--f-cond); font-weight:600; font-size:18px; letter-spacing:.06em; text-transform:uppercase; color:var(--gold); white-space:nowrap;\">Analistas · Top 10<\u002Fdiv>\n        <div style=\"width:18px; height:18px; border-radius:50%; background:var(--gold); margin:14px auto 0; box-shadow:0 0 0 5px rgba(194,145,46,0.25);\"><\u002Fdiv>\n      <\u002Fdiv>\n      <!-- banda modelo 41-50 => 68%..83% -->\n      <div data-bar=\"\" style=\"--d:.5s; position:absolute; left:68%; width:15%; top:27px; height:13px; background:var(--orange); transform-origin:left; border-radius:7px;\"><\u002Fdiv>\n      <div style=\"position:absolute; left:75.5%; top:46px; transform:translateX(-50%); font-family:var(--f-cond); font-weight:600; font-size:18px; letter-spacing:.06em; text-transform:uppercase; color:var(--orange); white-space:nowrap;\">Modelo · #41–50<\u002Fdiv>\n      <!-- brecha -->\n      <div data-line=\"\" style=\"--d:.85s; position:absolute; left:11%; width:57%; top:32px; height:2px; background:repeating-linear-gradient(90deg, var(--muted-d) 0 8px, transparent 8px 16px); transform-origin:left;\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; justify-content:space-between; font-family:var(--f-cond); font-size:17px; color:var(--muted-d); margin-top:14px;\"><span>Pick 1<\u002Fspan><span>30<\u002Fspan><span>60<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:48px; margin-top:34px;\">\n    <div data-anim=\"\" style=\"--d:.3s;\">\n      <div style=\"font-family:var(--f-cond); font-weight:600; font-size:20px; letter-spacing:.1em; text-transform:uppercase; color:var(--navy); margin-bottom:16px;\">Lo que los modelos capturan bien<\u002Fdiv>\n      <ul style=\"list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:13px; font-family:var(--f-serif); font-size:23px; line-height:1.32;\">\n        <li style=\"display:flex; gap:12px;\"><span style=\"color:var(--orange); font-weight:700;\">·<\u002Fspan><span>Probabilidad de draft &gt; 88 % para los tres jugadores<\u002Fspan><\u002Fli>\n        <li style=\"display:flex; gap:12px;\"><span style=\"color:var(--orange); font-weight:700;\">·<\u002Fspan><span>Baba Miller (R2 / #41–50) cuadra con los analistas<\u002Fspan><\u002Fli>\n        <li style=\"display:flex; gap:12px;\"><span style=\"color:var(--orange); font-weight:700;\">·<\u002Fspan><span>La alta varianza de Sergio de Larrea queda reflejada<\u002Fspan><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div data-anim=\"\" style=\"--d:.42s;\">\n      <div style=\"font-family:var(--f-cond); font-weight:600; font-size:20px; letter-spacing:.1em; text-transform:uppercase; color:var(--navy); margin-bottom:16px;\">Limitaciones estructurales<\u002Fdiv>\n      <ul style=\"list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:13px; font-family:var(--f-serif); font-size:23px; line-height:1.32;\">\n        <li style=\"display:flex; gap:12px;\"><span style=\"color:var(--navy); font-weight:700;\">·<\u002Fspan><span>La variable «posición» apenas aporta información<\u002Fspan><\u002Fli>\n        <li style=\"display:flex; gap:12px;\"><span style=\"color:var(--navy); font-weight:700;\">·<\u002Fspan><span>El dataset solo cubre la NCAA entre 2009–2021<\u002Fspan><\u002Fli>\n        <li style=\"display:flex; gap:12px;\"><span style=\"color:var(--navy); font-weight:700;\">·<\u002Fspan><span>Un pick 29 y un 31 son estadísticamente indistinguibles<\u002Fspan><\u002Fli>\n        <li style=\"display:flex; gap:12px;\"><span style=\"color:var(--navy); font-weight:700;\">·<\u002Fspan><span>Entrevistas, necesidades de franquicia e intangibles quedan fuera<\u002Fspan><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <p data-fade=\"\" style=\"--d:.8s; font-family:var(--f-serif); font-style:italic; font-size:30px; line-height:1.35; margin:30px 0 0;\">Tanto el modelo como los analistas tienen razón. Por eso, <strong>el draft no es solo estadística.<\u002Fstrong><\u002Fp>\n<\u002Fsection>\n\n<!-- 11 · CIERRE -->\n<section data-label=\"Cierre\" data-speaker-notes=\"DraftRadar demuestra que el machine learning puede complementar, no reemplazar, el ojo del scout. El modelo aporta probabilidades objetivas; el analista aporta contexto e intangibles. La combinación de ambos es la verdadera ventaja competitiva. Gracias.\" style=\"background:var(--ink); color:var(--paper); padding:var(--pad-y) var(--pad-x); display:flex; flex-direction:column; justify-content:center; overflow:hidden;\">\n  <div style=\"position:absolute; inset:0; background:repeating-radial-gradient(circle at 16% 50%, transparent 0 116px, rgba(220,90,34,0.11) 116px 119px); pointer-events:none;\" data-fade=\"\"><\u002Fdiv>\n  <div style=\"position:relative; max-width:1320px;\">\n    <div data-anim=\"\" style=\"--d:.1s; font-family:var(--f-disp); font-weight:900; font-size:40px; letter-spacing:-0.01em; margin-bottom:30px;\"><span style=\"color:var(--paper);\">Draft<\u002Fspan><span style=\"color:var(--orange);\">Radar<\u002Fspan><\u002Fdiv>\n    <h2 data-anim=\"\" style=\"--d:.24s; font-family:var(--f-disp); font-weight:800; font-size:84px; line-height:1.03; letter-spacing:-0.02em; margin:0; max-width:1240px;\">El analista que habla el algoritmo del baloncesto<\u002Fh2>\n    <p data-anim=\"\" style=\"--d:.42s; font-family:var(--f-serif); font-size:30px; line-height:1.46; color:var(--muted-d); max-width:1120px; margin:36px 0 0;\">El machine learning <strong style=\"color:var(--paper);\">complementa, no reemplaza<\u002Fstrong>, el ojo del scout. El modelo ofrece probabilidades objetivas basadas en datos; el analista aporta contexto, intangibles y visión de futuro. La combinación de ambos es la verdadera ventaja competitiva.<\u002Fp>\n\n    <div data-fade=\"\" style=\"--d:.62s; display:flex; gap:64px; margin-top:54px; padding-top:36px; border-top:1px solid var(--line-d);\">\n      <div>\n        <div style=\"font-family:var(--f-cond); font-weight:700; font-size:46px; color:var(--orange); line-height:1;\">4 · 3 · 7<\u002Fdiv>\n        <div style=\"font-family:var(--f-cond); font-size:19px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted-d); margin-top:8px;\">modelos · datasets · arquetipos<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:var(--f-cond); font-weight:700; font-size:46px; color:var(--orange); line-height:1;\">&gt; 88 %<\u002Fdiv>\n        <div style=\"font-family:var(--f-cond); font-size:19px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted-d); margin-top:8px;\">prob. de draft · 3 españoles<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-left:auto; text-align:right; align-self:flex-end;\">\n        <div style=\"font-family:var(--f-disp); font-weight:700; font-size:26px;\">Roberto Cantero<\u002Fdiv>\n        <div style=\"font-family:var(--f-cond); font-size:19px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted-d); margin-top:6px;\">The Bridge · Junio 2026<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    const stage = document.querySelector('deck-stage');\n    if (stage) stage.setAttribute('no-rail', '');\n    this._onSlide = (e) => {\n      const slide = e && e.detail && e.detail.slide;\n      this._animate(slide);\n    };\n    document.addEventListener('slidechange', this._onSlide);\n    // Initial active slide may have fired before listener attached.\n    setTimeout(() => {\n      const active = document.querySelector('section[data-deck-active]');\n      if (active) this._animate(active);\n    }, 200);\n  }\n\n  componentWillUnmount() {\n    document.removeEventListener('slidechange', this._onSlide);\n  }\n\n  _animate(slide) {\n    if (!slide || !slide.querySelectorAll) return;\n    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const els = slide.querySelectorAll('[data-count]');\n    els.forEach((el) => {\n      const to = parseFloat(el.getAttribute('data-count'));\n      const dec = parseInt(el.getAttribute('data-dec') || '0', 10);\n      const fmt = (v) => v.toLocaleString('es-ES', { minimumFractionDigits: dec, maximumFractionDigits: dec });\n      if (isNaN(to)) return;\n      if (reduce) { el.textContent = fmt(to); return; }\n      const dur = 1150;\n      const t0 = performance.now();\n      const tick = (now) => {\n        let t = Math.min(1, (now - t0) / dur);\n        const e = 1 - Math.pow(1 - t, 3);\n        el.textContent = fmt(to * e);\n        if (t < 1) requestAnimationFrame(tick);\n        else el.textContent = fmt(to);\n      };\n      requestAnimationFrame(tick);\n    });\n  }\n\n  _scatter() {\n    const clusters = [\n      { c: [82, 84], col: '#DC5A22' },\n      { c: [60, 62], col: '#22384C' },\n      { c: [26, 22], col: '#C2912E' },\n      { c: [42, 34], col: '#4E7C6B' },\n      { c: [70, 56], col: '#9C4A3C' },\n      { c: [74, 88], col: '#5B5170' },\n      { c: [52, 48], col: '#2F6E8F' },\n    ];\n    let seed = 1337;\n    const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };\n    const pts = [];\n    clusters.forEach((cl, ci) => {\n      for (let k = 0; k < 9; k++) {\n        const ang = rnd() * Math.PI * 2;\n        const rad = rnd() * 11 + 1.5;\n        const x = Math.max(5, Math.min(96, cl.c[0] + Math.cos(ang) * rad));\n        const y = Math.max(7, Math.min(95, cl.c[1] + Math.sin(ang) * rad * 0.92));\n        pts.push({\n          left: x.toFixed(1) + '%',\n          top: (100 - y).toFixed(1) + '%',\n          col: cl.col,\n          size: (k === 0 ? 20 : 13) + 'px',\n          d: (0.25 + ci * 0.08 + k * 0.012).toFixed(2) + 's',\n        });\n      }\n    });\n    return pts;\n  }\n\n  renderVals() {\n    return { scatterPoints: this._scatter() };\n  }\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
